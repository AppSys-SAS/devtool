<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/app-icon" />
    <title>AppSys Devtool</title>
    <style>
      html { color-scheme: light; background: oklch(1 0 0); }
      html.dark { color-scheme: dark; background: oklch(0.145 0 0); }
    </style>
    <script>
      {
        let mode = null;
        try {
          mode = localStorage.getItem("devtool-color-mode");
        } catch {}
        const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
