# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - 'dependabot[bot]'
  path_filters:
    - '!pnpm-lock.yaml'
    - '!CHANGELOG.md'
  tools:
    eslint:
      enabled: true
chat:
  auto_reply: true
